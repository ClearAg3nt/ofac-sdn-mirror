name: Sync OFAC SDN Names

# v0.5.2 (spec 2.1): one pipeline, one manifest. Poll hourly; rebuild when OFAC's
# Last-Modified changes, and every night at 02:00 UTC regardless.
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:        # manual trigger via GitHub UI or API — always rebuilds

env:
  KV_NAMESPACE: 018833e0500d4df5b179c6c568e60d30

jobs:
  poll:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.poll.outputs.build }}
    steps:
      - name: Compare OFAC Last-Modified with the published manifest
        id: poll
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 1-byte ranged GET, not HEAD: the OFAC API answers HEAD itself with a stale Last-Modified;
          # only GET redirects to the current S3 object and its real Last-Modified.
          LM=$(curl -sL -r 0-0 --max-time 60 -D - -o /dev/null "https://sanctionslistservice.ofac.treas.gov/api/PublicationPreview/exports/SDN.CSV" \
            | grep -i '^last-modified:' | tail -1 | sed 's/^[^:]*: *//' | tr -d '\r')
          OFAC_LM=$(python3 -c "import sys,email.utils as e; print(e.parsedate_to_datetime(sys.argv[1]).strftime('%Y-%m-%dT%H:%M:%SZ'))" "$LM" 2>/dev/null || echo "")
          # wrangler 4 kv commands default to LOCAL storage: --remote is required to touch production KV.
          CUR=$(npx wrangler@4 kv key get --remote --namespace-id "$KV_NAMESPACE" "sdn:current" 2>/dev/null \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['listVersion'].get('ofacLastModified',''))" 2>/dev/null || echo "")
          echo "OFAC Last-Modified: $OFAC_LM; manifest: ${CUR:-none}"
          if [ -n "$OFAC_LM" ] && [ -n "$CUR" ] && [ "$OFAC_LM" \> "$CUR" ]; then
            LAG=$(( $(date -d "$OFAC_LM" +%s) - $(date -d "$CUR" +%s) ))
            if [ "$LAG" -gt 7200 ]; then echo "::warning::G7 manifest is $((LAG/3600))h behind OFAC Last-Modified"; fi
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%H)" = "02" ] || [ -z "$CUR" ] || [ "$OFAC_LM" != "$CUR" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"; echo "No new OFAC file — skipping build"
          fi

  sync:
    needs: poll
    if: needs.poll.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write       # needed to push the updated JSON back to the repo

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch SDN CSV (primary entities)
        run: |
          fetch_csv() {
            local url="$1" outfile="$2" label="$3"
            echo "Trying $label..."
            HTTP_STATUS=$(curl -sL -w "%{http_code}" -D "${outfile}.headers" \
              -A "Mozilla/5.0 (compatible; ofac-sdn-mirror/1.0; +https://github.com/ClearAg3nt/ofac-sdn-mirror)" \
              --max-time 60 -o "$outfile" "$url")
            echo "  HTTP status: $HTTP_STATUS"
            if [ "$HTTP_STATUS" != "200" ] || [ ! -s "$outfile" ]; then
              echo "  ❌ Failed (status $HTTP_STATUS or empty)"
              return 1
            fi
            # Reject HTML responses (error pages that return 200)
            if head -c 256 "$outfile" | grep -qi "<!doctype\|<html\|<head"; then
              echo "  ❌ Got HTML page instead of CSV — server is returning an error page"
              head -c 500 "$outfile"
              return 1
            fi
            echo "  ✓ Size: $(wc -c < "$outfile") bytes, $(wc -l < "$outfile") lines"
            head -1 "$outfile"
            return 0
          }
          fetch_csv \
            "https://sanctionslistservice.ofac.treas.gov/api/PublicationPreview/exports/SDN.CSV" \
            sdn.csv "OFAC API (primary)" \
          || fetch_csv \
            "https://www.treasury.gov/ofac/downloads/sdn.csv" \
            sdn.csv "treasury.gov (fallback)" \
          || { echo "❌ All SDN CSV sources failed"; exit 1; }
          # v0.5.1: capture Last-Modified and fetch timestamp for listVersion provenance
          OFAC_LAST_MODIFIED=$(grep -i '^last-modified:' sdn.csv.headers 2>/dev/null | head -1 | sed 's/^[^:]*: *//' | tr -d '\r')
          FETCHED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "OFAC_LAST_MODIFIED=$OFAC_LAST_MODIFIED" >> "$GITHUB_ENV"
          echo "FETCHED_AT=$FETCHED_AT" >> "$GITHUB_ENV"
          echo "Last-Modified: $OFAC_LAST_MODIFIED, Fetched: $FETCHED_AT"

      - name: Fetch ALT CSV (aliases / AKAs)
        run: |
          fetch_csv() {
            local url="$1" outfile="$2" label="$3"
            echo "Trying $label..."
            HTTP_STATUS=$(curl -sL -w "%{http_code}" \
              -A "Mozilla/5.0 (compatible; ofac-sdn-mirror/1.0; +https://github.com/ClearAg3nt/ofac-sdn-mirror)" \
              --max-time 60 -o "$outfile" "$url")
            echo "  HTTP status: $HTTP_STATUS"
            if [ "$HTTP_STATUS" != "200" ] || [ ! -s "$outfile" ]; then
              echo "  ❌ Failed (status $HTTP_STATUS or empty)"
              return 1
            fi
            if head -c 256 "$outfile" | grep -qi "<!doctype\|<html\|<head"; then
              echo "  ❌ Got HTML page instead of CSV"
              head -c 500 "$outfile"
              return 1
            fi
            echo "  ✓ Size: $(wc -c < "$outfile") bytes, $(wc -l < "$outfile") lines"
            head -1 "$outfile"
            return 0
          }
          fetch_csv \
            "https://sanctionslistservice.ofac.treas.gov/api/PublicationPreview/exports/ALT.CSV" \
            alt.csv "OFAC API (primary)" \
          || fetch_csv \
            "https://www.treasury.gov/ofac/downloads/alt.csv" \
            alt.csv "treasury.gov (fallback)" \
          || { echo "❌ All ALT CSV sources failed"; exit 1; }

      - name: Diagnose CSV format
        run: |
          echo "=== sdn.csv first 3 rows ==="
          head -3 sdn.csv
          echo ""
          echo "=== sdn.csv column count on row 2 ==="
          python3 -c "
          import csv
          with open('sdn.csv', encoding='utf-8', errors='replace') as f:
              r = csv.reader(f)
              for i, row in enumerate(r):
                  print(f'Row {i}: {len(row)} columns')
                  for j, val in enumerate(row):
                      print(f'  [{j}] {repr(val[:60])}')
                  if i >= 2:
                      break
          "
          echo ""
          echo "=== alt.csv first 3 rows ==="
          head -3 alt.csv
          echo ""
          echo "=== alt.csv column count on row 2 ==="
          python3 -c "
          import csv
          with open('alt.csv', encoding='utf-8', errors='replace') as f:
              r = csv.reader(f)
              for i, row in enumerate(r):
                  print(f'Row {i}: {len(row)} columns')
                  for j, val in enumerate(row):
                      print(f'  [{j}] {repr(val[:60])}')
                  if i >= 2:
                      break
          "

      - name: Parse and normalise names
        run: python3 parse_ofac.py

      - name: Build identifier index and name index from the same download
        run: |
          python3 ingest_sdn_identifiers.py sdn.csv alt.csv sdn_identifiers.json "$OFAC_LAST_MODIFIED" "$FETCHED_AT"
          python3 build_names_index.py sdn_identifiers.json names.json
          echo "SDN_SHA=$(python3 -c "import json; print(json.load(open('sdn_identifiers.json'))['listVersion']['sha256'])")" >> "$GITHUB_ENV"
          echo "ALT_SHA=$(sha256sum alt.csv | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Fetch the previous build (for G8 delisting)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          PREV_KEY=$(npx wrangler@4 kv key get --remote --namespace-id "$KV_NAMESPACE" "sdn:current" 2>/dev/null \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['keys']['identifiers'])" 2>/dev/null || echo "ofac:ids:v2")
          npx wrangler@4 kv key get --remote --namespace-id "$KV_NAMESPACE" "$PREV_KEY" > prev_identifiers.json 2>/dev/null \
            && python3 -c "import json; json.load(open('prev_identifiers.json'))['entries']" \
            && echo "PREV_ARG=--previous prev_identifiers.json" >> "$GITHUB_ENV" \
            || echo "::warning::no previous build readable from KV ($PREV_KEY); G8 runs on the TORNADO CASH canary only"

      - name: Publish gates G1-G9 (fail = publish nothing, keep previous manifest)
        run: python3 check_build_gates.py sdn.csv sdn_identifiers.json metadata.json names.json $PREV_ARG --manifest-out manifest.json

      - name: Archive raw OFAC files (V3, 7-year retention)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_ARCHIVE_BUCKET }}
        run: |
          if [ -z "$R2_BUCKET" ]; then
            echo "::warning::R2_ARCHIVE_BUCKET is not set — raw files NOT archived (spec V3). Enable R2 and set the repo variable."
            exit 0
          fi
          npx wrangler@4 r2 object put --remote "$R2_BUCKET/ofac/sdn/$SDN_SHA.csv" --file sdn.csv --content-type text/csv
          npx wrangler@4 r2 object put --remote "$R2_BUCKET/ofac/alt/$ALT_SHA.csv" --file alt.csv --content-type text/csv

      - name: Sanity check
        run: |
          COUNT=$(python3 -c "import json; d=json.load(open('ofac_names.json')); print(len(d))")
          echo "Parsed $COUNT names"
          if [ "$COUNT" -lt 500 ]; then
            echo "❌ Sanity check failed — fewer than 500 names parsed"
            exit 1
          fi
          echo "✓ Sanity check passed"
          # Verify identifier index
          python3 -c "
          import json, sys
          idx = json.load(open('sdn_identifiers.json'))
          s = idx.get('stats', {})
          print(f'Identifier index: {s.get(\"entries\",0)} entries, {s.get(\"individuals\",0)} individuals, {s.get(\"individualsWithDob\",0)} with DOB')
          if s.get('individuals', 0) < 500:
              sys.exit('❌ Too few individuals in identifier index')
          print('✓ Identifier index sanity check passed')
          "

      - name: Publish to Cloudflare KV (content-addressed indexes first, manifest last)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          put() { npx wrangler@4 kv key put --remote --namespace-id "$KV_NAMESPACE" "$@"; }
          put "names:$SDN_SHA" --path names.json
          put "ids:$SDN_SHA"   --path sdn_identifiers.json
          # Rollout step 1: the v0.5.1 single-object keys, read by the worker only while no manifest exists.
          put "ofac:ids:v2"     --path sdn_identifiers.json
          put "ofac:names:meta" "$(cat metadata.json)"
          # The pointer goes last: a worker sees either the old build or the new one, never a mix.
          put "sdn:current" --path manifest.json
          echo "✓ KV updated: sdn:current -> $SDN_SHA"

      - name: Commit and push
        run: |
          git config user.name  "ofac-sdn-mirror[bot]"
          git config user.email "bot@clearagent.dev"
          git add ofac_names.json metadata.json
          if git diff --staged --quiet; then
            echo "No changes — SDN list unchanged since last sync"
          else
            git commit -m "sync: OFAC SDN names $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().split('T')[0];
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `OFAC SDN sync failed: ${today}`,
              body: `The scheduled OFAC SDN sync workflow failed.\n\n**Run:** ${runUrl}\n\nWorker cron at 02:00 UTC will use stale KV data until this is fixed.`,
              labels: ['sync-failure']
            });
