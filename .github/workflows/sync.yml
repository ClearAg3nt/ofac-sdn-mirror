name: Sync OFAC SDN Names

on:
  schedule:
    - cron: '0 1 * * *'   # 01:00 UTC daily — runs before KYA Worker cron at 02:00 UTC
  workflow_dispatch:        # manual trigger via GitHub UI or API

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # needed to push the updated JSON back to the repo

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch SDN CSV (primary entities)
        run: |
          fetch_csv() {
            local url="$1" outfile="$2" label="$3"
            echo "Trying $label..."
            HTTP_STATUS=$(curl -sL -w "%{http_code}" -D "${outfile}.headers" \
              -A "Mozilla/5.0 (compatible; ofac-sdn-mirror/1.0; +https://github.com/ClearAg3nt/ofac-sdn-mirror)" \
              --max-time 60 -o "$outfile" "$url")
            echo "  HTTP status: $HTTP_STATUS"
            if [ "$HTTP_STATUS" != "200" ] || [ ! -s "$outfile" ]; then
              echo "  ❌ Failed (status $HTTP_STATUS or empty)"
              return 1
            fi
            # Reject HTML responses (error pages that return 200)
            if head -c 256 "$outfile" | grep -qi "<!doctype\|<html\|<head"; then
              echo "  ❌ Got HTML page instead of CSV — server is returning an error page"
              head -c 500 "$outfile"
              return 1
            fi
            echo "  ✓ Size: $(wc -c < "$outfile") bytes, $(wc -l < "$outfile") lines"
            head -1 "$outfile"
            return 0
          }
          fetch_csv \
            "https://sanctionslistservice.ofac.treas.gov/api/PublicationPreview/exports/SDN.CSV" \
            sdn.csv "OFAC API (primary)" \
          || fetch_csv \
            "https://www.treasury.gov/ofac/downloads/sdn.csv" \
            sdn.csv "treasury.gov (fallback)" \
          || { echo "❌ All SDN CSV sources failed"; exit 1; }
          # v0.5.1: capture Last-Modified and fetch timestamp for listVersion provenance
          OFAC_LAST_MODIFIED=$(grep -i '^last-modified:' sdn.csv.headers 2>/dev/null | head -1 | sed 's/^[^:]*: *//' | tr -d '\r')
          FETCHED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "OFAC_LAST_MODIFIED=$OFAC_LAST_MODIFIED" >> "$GITHUB_ENV"
          echo "FETCHED_AT=$FETCHED_AT" >> "$GITHUB_ENV"
          echo "Last-Modified: $OFAC_LAST_MODIFIED, Fetched: $FETCHED_AT"

      - name: Fetch ALT CSV (aliases / AKAs)
        run: |
          fetch_csv() {
            local url="$1" outfile="$2" label="$3"
            echo "Trying $label..."
            HTTP_STATUS=$(curl -sL -w "%{http_code}" \
              -A "Mozilla/5.0 (compatible; ofac-sdn-mirror/1.0; +https://github.com/ClearAg3nt/ofac-sdn-mirror)" \
              --max-time 60 -o "$outfile" "$url")
            echo "  HTTP status: $HTTP_STATUS"
            if [ "$HTTP_STATUS" != "200" ] || [ ! -s "$outfile" ]; then
              echo "  ❌ Failed (status $HTTP_STATUS or empty)"
              return 1
            fi
            if head -c 256 "$outfile" | grep -qi "<!doctype\|<html\|<head"; then
              echo "  ❌ Got HTML page instead of CSV"
              head -c 500 "$outfile"
              return 1
            fi
            echo "  ✓ Size: $(wc -c < "$outfile") bytes, $(wc -l < "$outfile") lines"
            head -1 "$outfile"
            return 0
          }
          fetch_csv \
            "https://sanctionslistservice.ofac.treas.gov/api/PublicationPreview/exports/ALT.CSV" \
            alt.csv "OFAC API (primary)" \
          || fetch_csv \
            "https://www.treasury.gov/ofac/downloads/alt.csv" \
            alt.csv "treasury.gov (fallback)" \
          || { echo "❌ All ALT CSV sources failed"; exit 1; }

      - name: Diagnose CSV format
        run: |
          echo "=== sdn.csv first 3 rows ==="
          head -3 sdn.csv
          echo ""
          echo "=== sdn.csv column count on row 2 ==="
          python3 -c "
          import csv
          with open('sdn.csv', encoding='utf-8', errors='replace') as f:
              r = csv.reader(f)
              for i, row in enumerate(r):
                  print(f'Row {i}: {len(row)} columns')
                  for j, val in enumerate(row):
                      print(f'  [{j}] {repr(val[:60])}')
                  if i >= 2:
                      break
          "
          echo ""
          echo "=== alt.csv first 3 rows ==="
          head -3 alt.csv
          echo ""
          echo "=== alt.csv column count on row 2 ==="
          python3 -c "
          import csv
          with open('alt.csv', encoding='utf-8', errors='replace') as f:
              r = csv.reader(f)
              for i, row in enumerate(r):
                  print(f'Row {i}: {len(row)} columns')
                  for j, val in enumerate(row):
                      print(f'  [{j}] {repr(val[:60])}')
                  if i >= 2:
                      break
          "

      - name: Parse and normalise names
        run: python3 parse_ofac.py

      - name: Build v0.5.1 identifier index
        run: python3 ingest_sdn_identifiers.py sdn.csv alt.csv sdn_identifiers.json "$OFAC_LAST_MODIFIED" "$FETCHED_AT"

      - name: Publish gates G1-G7 (fail = keep previous KV index)
        run: python3 check_build_gates.py sdn.csv sdn_identifiers.json metadata.json

      - name: Sanity check
        run: |
          COUNT=$(python3 -c "import json; d=json.load(open('ofac_names.json')); print(len(d))")
          echo "Parsed $COUNT names"
          if [ "$COUNT" -lt 500 ]; then
            echo "❌ Sanity check failed — fewer than 500 names parsed"
            exit 1
          fi
          echo "✓ Sanity check passed"
          # Verify identifier index
          python3 -c "
          import json, sys
          idx = json.load(open('sdn_identifiers.json'))
          s = idx.get('stats', {})
          print(f'Identifier index: {s.get(\"entries\",0)} entries, {s.get(\"individuals\",0)} individuals, {s.get(\"individualsWithDob\",0)} with DOB')
          if s.get('individuals', 0) < 500:
              sys.exit('❌ Too few individuals in identifier index')
          print('✓ Identifier index sanity check passed')
          "

      - name: Push to Cloudflare KV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Write the names array directly to KV — bypasses raw.githubusercontent.com fetch
          npx wrangler@4 kv key put \
            --namespace-id 018833e0500d4df5b179c6c568e60d30 \
            "ofac:names:v1" \
            --path ofac_names.json
          # Write metadata
          npx wrangler@4 kv key put \
            --namespace-id 018833e0500d4df5b179c6c568e60d30 \
            "ofac:names:meta" \
            "$(cat metadata.json)"
          # Secondary identifiers + SDN entry types (person vs entity, DOB, nationality,
          # national ID / passport). Consumed by /v1/screen for identifier comparison.
          npx wrangler@4 kv key put \
            --namespace-id 018833e0500d4df5b179c6c568e60d30 \
            "ofac:ids:v1" \
            --path ofac_identifiers.json
          # Types-only projection (name -> i/e/v/a) — small, kept warm per request.
          npx wrangler@4 kv key put \
            --namespace-id 018833e0500d4df5b179c6c568e60d30 \
            "ofac:types:v1" \
            --path ofac_types.json
          # v0.5.0: full identifier index (DOB, nationality, documents, wallets per UID)
          npx wrangler@4 kv key put \
            --namespace-id 018833e0500d4df5b179c6c568e60d30 \
            "ofac:ids:v2" \
            --path sdn_identifiers.json
          echo "✓ KV updated"

      - name: Commit and push
        run: |
          git config user.name  "ofac-sdn-mirror[bot]"
          git config user.email "bot@clearagent.dev"
          git add ofac_names.json metadata.json
          if git diff --staged --quiet; then
            echo "No changes — SDN list unchanged since last sync"
          else
            git commit -m "sync: OFAC SDN names $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().split('T')[0];
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `OFAC SDN sync failed: ${today}`,
              body: `The scheduled OFAC SDN sync workflow failed.\n\n**Run:** ${runUrl}\n\nWorker cron at 02:00 UTC will use stale KV data until this is fixed.`,
              labels: ['sync-failure']
            });
